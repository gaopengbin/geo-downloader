name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate or build (for example v3.6.22)
        required: true
        type: string
      validate_only:
        description: Validate metadata and notes without rebuilding or modifying a release
        default: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      tag: ${{ steps.preflight.outputs.tag }}
      source_sha: ${{ steps.preflight.outputs.source_sha }}
      notes_path: ${{ steps.preflight.outputs.notes_path }}
      prerelease: ${{ steps.preflight.outputs.prerelease }}
    steps:
      - name: Checkout validation tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release validation
        run: python -m unittest discover -s control/scripts -p test_validate_release.py
      - name: Test Windows installer verification
        run: python -m unittest discover -s control/scripts -p test_windows_release_payload.py
      - name: Test update manifest canonical links
        run: python -m unittest discover -s control/scripts -p test_update_manifest.py
      - name: Validate tag, native versions and release notes
        id: preflight
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python control/scripts/validate_release.py --root source

  build:
    needs: validate
    if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -e
          # 使用 npm install 代替 npm ci，避免 lockfile 在不同 npm 版本下
          # 对 wasm-only optional deps（@emnapi/runtime、@emnapi/core 等）的处理差异
          # 导致的 EUSAGE Missing 报错。
          for i in 1 2 3; do
            echo "::group::npm install attempt $i"
            npm install --no-audit --no-fund --prefer-offline && [ -d node_modules ] && [ -x node_modules/.bin/vite ] && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            echo "npm install attempt $i failed or produced empty node_modules, retrying..."
            rm -rf node_modules
            sleep 5
          done
          echo "npm install failed after 3 attempts"
          exit 1

      - name: Run frontend regressions
        if: runner.os == 'Windows'
        working-directory: frontend
        run: npm test

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        # 用 binstall 拉预编译二进制（秒级），替代 cargo install 从源码编译（~10 分钟）
        run: cargo binstall -y --locked tauri-cli@^2

      - name: Build and verify production frontend configuration
        shell: bash
        env:
          VITE_TELEMETRY_ENDPOINT: https://laogao.xyz/geod-telemetry/v1/events
        run: |
          set -euo pipefail
          cargo tauri build --target ${{ matrix.target }} -- --locked
          grep -Fq "$VITE_TELEMETRY_ENDPOINT" frontend/dist/assets/*.js

      - name: Run native regressions on the shipping architecture
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          test "$host" = "$RELEASE_TARGET"
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target "$RELEASE_TARGET" --lib -- --test-threads=1

      - name: Checkout the Unix package startup check
        if: runner.os != 'Windows'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-control
          sparse-checkout: scripts/check_unix_release_startup.py
          sparse-checkout-cone-mode: false

      - name: Verify and launch the macOS app from the release DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -type f -name "*.dmg" | head -1)
          test -n "$DMG"
          MOUNT_DIR=$(mktemp -d)
          trap 'hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true; rm -rf "$MOUNT_DIR"' EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP=$(find "$MOUNT_DIR" -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$APP"
          executable=$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")
          lipo -verify_arch "$(uname -m)" "$APP/Contents/MacOS/$executable"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1
          installed=$(mktemp -d "$RUNNER_TEMP/geod-mac-app.XXXXXX")/"$(basename "$APP")"
          ditto "$APP" "$installed"
          python3 release-control/scripts/check_unix_release_startup.py "$installed/Contents/MacOS/$executable"

      - name: Checkout the Windows installer verification tool
        if: runner.os == 'Windows'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-control
          sparse-checkout: |
            scripts/check_windows_release_payload.py
            scripts/test_windows_upgrade.mjs
          sparse-checkout-cone-mode: false

      # Windows: 收集 .exe
      - name: Collect Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GEOD_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $exeFile = Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          python release-control/scripts/check_windows_release_payload.py $exeFile.FullName "src-tauri/target/${{ matrix.target }}/release/geo-downloader.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node release-control/scripts/test_windows_upgrade.mjs $exeFile.FullName "$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $newName = "GeoDownloader_${{ needs.validate.outputs.version }}_windows_x64-setup.exe"
          Copy-Item $exeFile.FullName -Destination $newName
          echo "ARTIFACT=$newName" >> $env:GITHUB_OUTPUT
        id: collect-win

      # macOS: 收集 .dmg
      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ARCH=$([[ "${{ matrix.target }}" == *aarch64* ]] && echo "arm64" || echo "x64")
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          NEW_NAME="GeoDownloader_${{ needs.validate.outputs.version }}_macos_${ARCH}.dmg"
          cp "$DMG" "$NEW_NAME"
          echo "ARTIFACT=$NEW_NAME" >> $GITHUB_OUTPUT
        id: collect-mac

      # Linux: 收集 .deb 和 .AppImage
      - name: Collect Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          DEB=$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -name "*.deb" | head -1)
          APPIMAGE=$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" | head -1)
          test "$(dpkg-deb -f "$DEB" Architecture)" = amd64
          LC_ALL=C readelf -h "$APPIMAGE" | grep 'Machine:.*X86-64'
          sudo apt-get install -y "./$DEB"
          deb_binary=/usr/bin/geo-downloader
          package=$(dpkg-deb -f "$DEB" Package)
          dpkg-query -L "$package" | grep -Fx "$deb_binary"
          test -x "$deb_binary"
          dbus-run-session -- xvfb-run -a python3 release-control/scripts/check_unix_release_startup.py "$deb_binary"
          # Execute the AppImage payload on runners that do not expose /dev/fuse.
          appimage_path=$(realpath "$APPIMAGE")
          appimage_dir=$(mktemp -d "$RUNNER_TEMP/geod-appimage.XXXXXX")
          (cd "$appimage_dir" && "$appimage_path" --appimage-extract > /dev/null)
          dbus-run-session -- xvfb-run -a python3 release-control/scripts/check_unix_release_startup.py "$appimage_dir/squashfs-root/AppRun"
          DEB_NAME="GeoDownloader_${{ needs.validate.outputs.version }}_linux_amd64.deb"
          APPIMAGE_NAME="GeoDownloader_${{ needs.validate.outputs.version }}_linux_amd64.AppImage"
          cp "$DEB" "$DEB_NAME"
          cp "$APPIMAGE" "$APPIMAGE_NAME"
          echo "DEB=$DEB_NAME" >> $GITHUB_OUTPUT
          echo "APPIMAGE=$APPIMAGE_NAME" >> $GITHUB_OUTPUT
        id: collect-linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: GeoDownloader_*
          retention-days: 3

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Checkout manifest validation tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: 'GeoDownloader v${{ needs.validate.outputs.version }}'
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.source_sha }}
          body_path: ${{ needs.validate.outputs.notes_path }}
          # Publish after the public API and checksum-verified mirror are ready.
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          files: artifacts/GeoDownloader_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build canonical mirror manifest for staging
        if: needs.validate.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release-metadata.json
          python control/scripts/update_manifest.py --release release-metadata.json --output update.json --allow-draft-for-staging
          python control/scripts/update_manifest.py --validate update.json

      - name: Upload mirror staging manifest
        if: needs.validate.outputs.prerelease != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-mirror-manifest
          path: update.json
          retention-days: 3

      # Mirror deployment uses locally downloaded artifacts and pinned-key SSH.
      # Production hosts must not download GitHub resources.
