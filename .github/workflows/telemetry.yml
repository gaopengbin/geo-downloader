name: GeoD Telemetry Service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test collector
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/telemetry/package-lock.json

      - name: Install and test
        working-directory: services/telemetry
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Dispatch production deployment
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DEPLOY_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/gaopengbin/gaopengbin-dashboard/dispatches \
            --input - <<'JSON'
          {
            "event_type": "deploy",
            "client_payload": {
              "project": "geo-downloader",
              "target": "telemetry",
              "ref": "${{ github.sha }}"
            }
          }
          JSON
