[package]
name = "geod-cli"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Headless imagery and boundary data acquisition"

[[bin]]
name = "geod"
path = "src/main.rs"

[dependencies]
geod-core = { path = "../geod-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = "=0.12.28"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
