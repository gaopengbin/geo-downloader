<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoD AI 网关测试</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main {
        width: min(760px, 100%);
        height: min(760px, calc(100vh - 48px));
        min-height: 520px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: #fff;
        border: 1px solid #dce3ee;
        border-radius: 8px;
        box-shadow: 0 18px 54px rgba(29, 54, 91, .12);
        overflow: hidden;
      }
      header { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid #e6ebf2; }
      .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 800; }
      h1 { margin: 0; font-size: 17px; }
      .status { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: #64748b; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
      .dot.ready { background: #16a34a; }
      #messages { min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
      .message { max-width: 82%; padding: 10px 12px; border-radius: 8px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
      .assistant { align-self: flex-start; background: #f1f5f9; }
      .user { align-self: flex-end; background: #2563eb; color: #fff; }
      form { display: grid; gap: 10px; padding: 14px; border-top: 1px solid #e6ebf2; background: #fbfcfe; }
      .token-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      input, textarea, button { font: inherit; }
      input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: inherit; outline: none; }
      input { height: 38px; padding: 0 11px; font-size: 13px; }
      textarea { min-height: 72px; max-height: 180px; padding: 10px 11px; resize: vertical; line-height: 1.5; }
      input:focus, textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
      button { height: 38px; border: 0; border-radius: 6px; padding: 0 18px; background: #2563eb; color: #fff; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      .send-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
      small { color: #64748b; }
      @media (max-width: 600px) {
        body { padding: 0; }
        main { width: 100%; height: 100vh; border: 0; border-radius: 0; }
        .message { max-width: 92%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark">D</div>
        <div>
          <h1>GeoD AI 网关测试</h1>
          <small id="mode">正在检查服务...</small>
        </div>
        <div class="status"><span class="dot" id="dot"></span><span id="status">连接中</span></div>
      </header>
      <section id="messages" aria-live="polite">
        <div class="message assistant">你好，我是 GeoD 助手。这里用于验证网关问答和流式输出。</div>
      </section>
      <form id="chat-form">
        <div class="token-row">
          <input id="token" type="password" value="geod-local-test" placeholder="网关访问令牌" autocomplete="off" />
          <button type="button" id="health-button">检查</button>
        </div>
        <div class="send-row">
          <textarea id="prompt" placeholder="输入测试问题..." required></textarea>
          <button type="submit" id="send-button">发送</button>
        </div>
      </form>
    </main>
    <script>
      const messages = document.querySelector('#messages')
      const form = document.querySelector('#chat-form')
      const prompt = document.querySelector('#prompt')
      const token = document.querySelector('#token')
      const sendButton = document.querySelector('#send-button')
      const healthButton = document.querySelector('#health-button')
      const status = document.querySelector('#status')
      const mode = document.querySelector('#mode')
      const dot = document.querySelector('#dot')

      function addMessage(role, text = '') {
        const element = document.createElement('div')
        element.className = `message ${role}`
        element.textContent = text
        messages.append(element)
        messages.scrollTop = messages.scrollHeight
        return element
      }

      async function checkHealth() {
        try {
          const response = await fetch('/health')
          const data = await response.json()
          if (!response.ok) throw new Error(data?.error?.message || '服务异常')
          dot.classList.add('ready')
          status.textContent = '已连接'
          mode.textContent = `${data.mode === 'mock' ? '模拟模式' : '真实模型'} · ${data.model || '未配置模型'}`
        } catch (error) {
          dot.classList.remove('ready')
          status.textContent = '不可用'
          mode.textContent = error.message
        }
      }

      async function ask(question) {
        const assistant = addMessage('assistant')
        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            authorization: `Bearer ${token.value}`,
          },
          body: JSON.stringify({
            messages: [{ role: 'user', content: question }],
            stream: true,
          }),
        })

        if (!response.ok) {
          const data = await response.json().catch(() => null)
          throw new Error(data?.error?.message || `请求失败 (${response.status})`)
        }

        const reader = response.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''
        while (true) {
          const { done, value } = await reader.read()
          if (done) break
          buffer += decoder.decode(value, { stream: true })
          const events = buffer.split('\n\n')
          buffer = events.pop() || ''
          for (const event of events) {
            const line = event.split('\n').find((item) => item.startsWith('data: '))
            if (!line || line === 'data: [DONE]') continue
            const data = JSON.parse(line.slice(6))
            assistant.textContent += data.choices?.[0]?.delta?.content || ''
            messages.scrollTop = messages.scrollHeight
          }
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        const question = prompt.value.trim()
        if (!question) return
        addMessage('user', question)
        prompt.value = ''
        sendButton.disabled = true
        try {
          await ask(question)
        } catch (error) {
          addMessage('assistant', `请求失败：${error.message}`)
        } finally {
          sendButton.disabled = false
          prompt.focus()
        }
      })

      healthButton.addEventListener('click', checkHealth)
      prompt.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault()
          form.requestSubmit()
        }
      })
      checkHealth()
    </script>
  </body>
</html>
