name: Maintain artifact storage

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_run:
    workflows: ["Build GeoD MCP Linux","Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; do not delete artifacts or caches
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: artifact-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # Never execute an upstream PR's source in this privileged workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
      - name: Test cleanup safety invariants
        run: node --test .github/scripts/artifact-retention.test.cjs .github/scripts/cache-retention.test.cjs
      - name: Apply allowlisted artifact retention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          PINNED_RUN_IDS: ${{ vars.ARTIFACT_RETENTION_PINNED_RUN_IDS }}
        run: node .github/scripts/artifact-retention.cjs
      - name: Apply dependency-cache retention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node .github/scripts/cache-retention.cjs
