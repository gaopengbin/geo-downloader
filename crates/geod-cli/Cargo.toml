[package]
name = "geod-cli"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Headless imagery and boundary data acquisition"

[[bin]]
name = "geod"
path = "src/main.rs"

[dependencies]
geod-core = { path = "../geod-core" }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
